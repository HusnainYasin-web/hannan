```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baby Memories</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8f3;
            overflow-x: hidden;
        }

        /* ================= HERO ================= */

        .hero {
            min-height: 650px;
            position: relative;
            overflow: hidden;
            padding: 40px 5%;
            background: linear-gradient(
                135deg,
                #ead6c9,
                #fff4ed,
                #e8d9d0
            );
        }

        /* Decorative stars */

        .star {
            position: absolute;
            font-size: 35px;
            animation: floatStar 4s ease-in-out infinite;
            opacity: 0.8;
        }

        .star1 {
            top: 70px;
            left: 8%;
        }

        .star2 {
            top: 130px;
            right: 15%;
            animation-delay: 1s;
        }

        .star3 {
            bottom: 180px;
            left: 20%;
            animation-delay: 2s;
        }

        @keyframes floatStar {
            0%,100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(15deg);
            }
        }

        /* Moon */

        .moon {
            position: absolute;
            top: 55px;
            left: 4%;
            font-size: 80px;
            animation: moonFloat 5s ease-in-out infinite;
        }

        @keyframes moonFloat {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        /* ================= MAIN PHOTO ================= */

        .main-photo {
            width: min(560px, 80vw);
            height: 470px;

            margin: 30px auto 0;

            border: 8px solid white;
            border-radius: 45% 45% 35% 35%;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(100, 70, 50, 0.2);

            animation: photoAppear 1.2s ease;
        }

        .main-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition:
                transform 0.8s ease,
                opacity 0.4s ease;
        }

        .main-photo:hover img {
            transform: scale(1.08);
        }

        @keyframes photoAppear {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* ================= SIDE PHOTOS ================= */

        .side-photo {
            position: absolute;
            width: 210px;
            height: 260px;

            background: white;
            padding: 10px;

            border-radius: 15px;

            box-shadow: 0 15px 35px rgba(0,0,0,0.15);

            transition: 0.5s;
        }

        .side-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .side-photo:hover {
            transform: scale(1.08) rotate(0deg) !important;
        }

        .photo-left {
            left: 5%;
            top: 250px;
            transform: rotate(-8deg);
        }

        .photo-right {
            right: 5%;
            top: 210px;
            transform: rotate(8deg);
        }

        /* ================= BABY BADGE ================= */

        .baby-badge {
            position: absolute;

            left: 13%;
            top: 190px;

            width: 170px;
            height: 170px;

            background: #ffe6dc;

            border-radius: 50%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: #966b55;

            box-shadow: 0 10px 30px rgba(100,70,50,.12);

            animation: badgeFloat 4s ease-in-out infinite;
        }

        .baby-badge strong {
            font-size: 55px;
        }

        .baby-badge span {
            font-size: 22px;
        }

        @keyframes badgeFloat {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* ================= HEARTS ================= */

        .heart {
            position: absolute;
            color: #efa8a8;
            font-size: 35px;

            animation: heartFloat 4s ease-in-out infinite;
        }

        .heart1 {
            top: 100px;
            right: 25%;
        }

        .heart2 {
            bottom: 120px;
            left: 10%;
            animation-delay: 1s;
        }

        .heart3 {
            right: 10%;
            bottom: 150px;
            animation-delay: 2s;
        }

        @keyframes heartFloat {
            0%,100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-25px) scale(1.15);
            }
        }

        /* ================= WAVE ================= */

        .wave {
            position: absolute;
            bottom: -2px;
            left: 0;

            width: 100%;
            height: 100px;

            background: #fff8f3;

            clip-path: ellipse(75% 50% at 50% 100%);
        }

        /* ================= GALLERY ================= */

        .gallery {
            padding: 60px 5% 100px;

            background: #fff8f3;

            text-align: center;
        }

        .gallery-container {
            max-width: 1250px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .gallery-card {
            height: 220px;

            overflow: hidden;

            border-radius: 18px;

            background: white;

            box-shadow:
                0 10px 30px rgba(100,70,50,.12);

            opacity: 0;
            transform: translateY(50px);

            animation: galleryShow 1s forwards;
        }

        .gallery-card:nth-child(2) {
            animation-delay: .2s;
        }

        .gallery-card:nth-child(3) {
            animation-delay: .4s;
        }

        .gallery-card:nth-child(4) {
            animation-delay: .6s;
        }

        @keyframes galleryShow {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: transform .7s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.12);
        }

        /* ================= DOTS ================= */

        .dots {
            margin-top: 35px;

            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .dot {
            width: 11px;
            height: 11px;

            background: #d8ccc5;

            border-radius: 50%;
        }

        .dot.active {
            background: #6d5a4e;
            transform: scale(1.3);
        }

        /* ================= FOOT DECORATION ================= */

        .decoration {
            text-align: center;
            padding: 20px;

            color: #d49c91;

            font-size: 30px;

            letter-spacing: 10px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .side-photo {
                width: 150px;
                height: 190px;
            }

            .photo-left {
                left: 2%;
            }

            .photo-right {
                right: 2%;
            }

            .baby-badge {
                left: 5%;
                width: 120px;
                height: 120px;
            }

            .baby-badge strong {
                font-size: 40px;
            }

            .baby-badge span {
                font-size: 16px;
            }

            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .hero {
                min-height: 620px;
            }

            .main-photo {
                width: 90%;
                height: 390px;
            }

            .side-photo {
                width: 100px;
                height: 130px;
            }

            .photo-left {
                top: 420px;
                left: 2%;
            }

            .photo-right {
                top: 420px;
                right: 2%;
            }

            .baby-badge {
                top: 120px;
                left: 5%;
                width: 95px;
                height: 95px;
            }

            .baby-badge strong {
                font-size: 30px;
            }

            .baby-badge span {
                font-size: 13px;
            }

            .gallery-container {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .gallery-card {
                height: 160px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="moon">🌙</div>

        <div class="star star1">⭐</div>
        <div class="star star2">⭐</div>
        <div class="star star3">✨</div>

        <div class="heart heart1">♡</div>
        <div class="heart heart2">♡</div>
        <div class="heart heart3">♡</div>

        <!-- Left Image -->

        <div class="side-photo photo-left">
            <img src="h8.png">
        </div>

        <!-- Main Image -->

        <div class="main-photo">

            <img
                id="mainImage"
                src="h5.png">

        </div>

        <!-- Right Image -->

        <div class="side-photo photo-right">

            <img src="h6.png">

        </div>

        <div class="wave"></div>

    </section>


    <!-- ================= GALLERY ================= -->

    <section class="gallery">

        <div class="gallery-container">

            <div class="gallery-card">
                <img src="h4.png">
            </div>

            <div class="gallery-card">
                <img src="h3.png">
            </div>

            <div class="gallery-card">
                <img src="h2.png">
            </div>

            <div class="gallery-card">
                <img src="h1.png">
            </div>

        </div>

    </section>


    <script>

        /* ================= MAIN IMAGE SLIDER ================= */

        /* یہاں اب صرف آپ کی اپنی تصاویر ہیں */

        const images = [
            "h5.png",
            "h6.png",
            "h7.png"
        ];

        let current = 0;

        const mainImage =
            document.getElementById("mainImage");


        setInterval(() => {

            current++;

            if (current >= images.length) {
                current = 0;
            }

            /* Fade Out */

            mainImage.style.opacity = "0";

            setTimeout(() => {

                /* اپنی تصویر لگے گی */
                mainImage.src = images[current];

                /* Fade In */

                mainImage.style.opacity = "1";

            }, 400);

        }, 4000);


        /* ================= RANDOM FLOATING HEARTS ================= */

        function createHeart() {

            const heart =
                document.createElement("div");

            heart.innerHTML = "♥";

            heart.style.position = "fixed";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.bottom = "-30px";

            heart.style.color = "#efaaa6";

            heart.style.fontSize =
                (Math.random() * 20 + 15) + "px";

            heart.style.pointerEvents = "none";

            heart.style.zIndex = "1000";

            document.body.appendChild(heart);


            const duration =
                Math.random() * 3000 + 4000;


            heart.animate(

                [
                    {
                        transform:
                            "translateY(0) rotate(0)",
                        opacity: 0
                    },

                    {
                        transform:
                            "translateY(-100vh) rotate(360deg)",
                        opacity: 0.8
                    }
                ],

                {
                    duration: duration,
                    easing: "linear"
                }

            );


            setTimeout(() => {

                heart.remove();

            }, duration);

        }


        setInterval(createHeart, 1200);

    </script>

</body>
</html>
